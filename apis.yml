aid: ericsson
name: Ericsson
description: >-
  Ericsson (Telefonaktiebolaget LM Ericsson) is a Swedish multinational
  networking and telecommunications equipment vendor headquartered in Kista,
  Stockholm. Founded in 1876, the company supplies mobile and fixed network
  infrastructure to communication service providers worldwide and operates
  across three product areas: Networks (5G RAN, 5G Core, Cloud RAN, transport),
  Cloud Software & Services (OSS/BSS, orchestration, billing, charging,
  analytics), and Enterprise Wireless Solutions (private 5G via Cradlepoint).
  Ericsson holds more than 60,000 granted patents and operates 21 R&D centers,
  with networks that carry roughly 40 percent of the world's mobile data
  traffic. In 2024 Ericsson and twelve major operators — AT&T, Bharti Airtel,
  Deutsche Telekom, KDDI, Orange, Reliance Jio, Singtel, Telefonica, Telstra,
  T-Mobile, Verizon, and Vodafone — closed Aduna, a 50:50 joint venture that
  aggregates CAMARA-aligned network APIs (SIM Swap, Number Verification,
  Quality on Demand, Device Location, Device Reachability, Scam Signal, Call
  Forwarding Signal, Connectivity Insights, OTP SMS) and exposes them through
  hyperscaler and CPaaS channel partners (Microsoft Azure Marketplace, Google
  Cloud, Vonage, Sinch, Infobip). Ericsson also owns Vonage (acquired 2022),
  which operates the public-facing developer portal for many of these network
  capabilities, and runs the Ericsson Intelligent Automation Platform (EIAP)
  for ORAN-aligned rApp development. Ericsson does not publish a single
  consolidated developer portal or canonical OpenAPI catalog at
  ericsson.com — its programmable surface is delivered indirectly through
  Aduna, Vonage, and channel partners, and most of its public GitHub presence
  is research tooling and infrastructure software (CodeChecker, CodeCompass,
  ecchronos) rather than developer-facing APIs.
